
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, viewport-fit=cover">
    <title>imali</title>
    <meta name="description" content="A modern, culturally-inspired micro-lending platform designed for South African micro-lenders and borrowers. Features include automated penalty calculations, comprehensive borrower dossiers, KYC tracking, credit health metrics, real-time Firestore synchronization, and isiXhosa cultural aesthetic." />
    <meta property="og:title" content="imali" />

    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">

    <style>
        :root {
            --sat: env(safe-area-inset-top, 0px);
            --sab: env(safe-area-inset-bottom, 0px);
            --sal: env(safe-area-inset-left, 0px);
            --sar: env(safe-area-inset-right, 0px);
        }
        html, body {
            max-width: 100vw;
            overflow-x: hidden;
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
            touch-action: manipulation;
        }
        *, *:before, *:after {
            box-sizing: inherit;
        }
        body {
            font-family: 'Lexend', system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background-color: #fdfcfb;
            color: #1a1a1a;
        }
        h1, h2, h3, h4, .font-heading {
            font-family: 'Plus Jakarta Sans', 'Lexend', sans-serif;
        }
        .xhosa-pattern {
            background-image: url("data:image/svg+xml,%3Csvg width='80' height='80' viewBox='0 0 80 80' xmlns='http://www.w3.org/2000/svg'%3E%3Cg fill='none' fill-rule='evenodd'%3E%3Cg fill='%234F46E5' fill-opacity='0.02'%3E%3Cpath d='M40 40l20-20-20-20-20 20zm0 0l20 20-20 20-20-20zM0 40l20-20-20-20L-20 20zm0 0l20 20-20 20-20-20zm80 0l20-20-20-20-20 20zm0 0l20 20-20 20-20-20zM40 0l20-20-20-20-20 20zm0 0l20 20-20 20-20-20zm0 80l20-20-20-20-20 20zm0 0l20 20-20 20-20-20z'/%3E%3C/g%3E%3C/g%3E%3C/svg%3E");
        }
        .custom-scrollbar::-webkit-scrollbar { width: 6px; }
        .custom-scrollbar::-webkit-scrollbar-track { background: #f1f1f1; border-radius: 10px; }
        .custom-scrollbar::-webkit-scrollbar-thumb { background: #d1d1d1; border-radius: 10px; }
        .custom-scrollbar::-webkit-scrollbar-thumb:hover { background: #1a1a1a; }
        @keyframes shimmer-slide {
            0% { transform: translateX(-100%); }
            100% { transform: translateX(250%); }
        }
        .animate-shimmer-slide {
            animation: shimmer-slide 2.4s cubic-bezier(0.4, 0, 0.2, 1) infinite;
        }
    </style>
<link rel="stylesheet" href="/index.css">

    <div id="root"></div>
